name: Release

# Changesets on main become a "Version packages" pull request; merging it publishes to npm.
# Each job gets only the permissions it needs, and only the publish job can mint an npm token.
# See docs/RELEASING.md for the one-time npm setup.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  select-mode:
    # Forks have no npm access, and no reason to open version pull requests.
    if: github.repository == 'Subterra-Technologies/blockletter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action/version@v2
        with:
          script: npm run version-packages
          commit-message: 'chore: version packages'
          pr-title: Version packages
        env:
          # The GitHub changelog format looks up each change's pull request and author.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:denylist
      - run: npm test
      - run: npm run build -w packages/core && npm run build -w packages/react
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          # npm's trusted publishing authenticates this job with a short-lived credential GitHub
          # issues for it, so no npm token is stored anywhere; it is configured for each package on
          # npmjs.com (docs/RELEASING.md). Every package it publishes carries a provenance
          # attestation.
          NPM_CONFIG_PROVENANCE: 'true'
