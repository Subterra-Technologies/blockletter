# Weekly dependency updates, grouped so routine bumps arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Major versions that need a migration of their own, not a bump: TypeScript 7; ESLint 10,
      # which eslint-plugin-jsx-a11y does not support yet; and the Node types, which follow the
      # oldest Node the packages support (22).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # The examples are not workspaces; they track their frameworks monthly, in one pull request.
  # Their Blockletter ranges move with each release (`npm run version-packages`), not here.
  - package-ecosystem: npm
    directories: ['/examples/node', '/examples/nextjs', '/examples/convex']
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '@subterra-technologies/*'
      # As at the root: the Node types follow the oldest Node the examples run on (22.18).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      examples:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
