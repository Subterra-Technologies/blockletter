name: Feature request
description: A new block, render option, editor capability, or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, including the API you would expect to call.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, custom blocks, or other approaches you considered.
