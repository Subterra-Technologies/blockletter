name: Bug report
description: Something renders wrong, breaks in an email client, or misbehaves in the editor.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For anything security-related, please follow SECURITY.md instead
        of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or document to reproduce
      description: >
        The smallest document that shows the problem helps most. The demo's Rendering section has
        a Document tab you can copy from.
      render: json
  - type: input
    id: where
    attributes:
      label: Where it happens
      description: Package version, browser, and for rendering bugs the email client and device.
      placeholder: '@subterra-technologies/blockletter 0.1.0, Chrome 140, an iPhone mail app'
    validations:
      required: true
